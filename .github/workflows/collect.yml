name: Collect bhavcopy

# Runs every weekday evening after NSE publishes the day's file.
# 14:00 UTC = 19:30 IST. Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Calendar days to backfill (leave blank for daily run)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install "httpx[http2]" pandas

      - name: Collect
        run: |
          if [ -n "${{ github.event.inputs.backfill }}" ]; then
            python collect.py --backfill ${{ github.event.inputs.backfill }}
          else
            python collect.py
          fi

      - name: Commit new data
        run: |
          git config user.name  "bhavcopy-collector"
          git config user.email "actions@github.com"
          git add data/history/
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Bhavcopy: $(date -u +%Y-%m-%d)"
            git push
          fi
